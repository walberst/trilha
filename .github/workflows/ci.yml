name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

defaults:
  run:
    working-directory: backend

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .

  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest --cov=app --cov-report=term-missing

  build:
    runs-on: ubuntu-latest
    needs: [lint, testes]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build imagem da API
        uses: docker/build-push-action@v6
        with:
          context: backend
          target: api
          push: false
          tags: trilha-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build imagem do worker
        uses: docker/build-push-action@v6
        with:
          context: backend
          target: worker
          push: false
          tags: trilha-worker:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build imagem do simulador
        uses: docker/build-push-action@v6
        with:
          context: backend
          target: simulator
          push: false
          tags: trilha-simulator:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build imagem do frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          tags: trilha-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
